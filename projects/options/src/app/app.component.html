<div class="page">
  <shared-header
          (themeToggle)="toggleTheme()"
          [showThemeToggle]="true"
          [themeService]="themeService">
  </shared-header>
  <div class="header-title">Settings</div>

  <!-- Toast Notifications Container -->
  <shared-toast-container
          (clearError)="onClearError()"
          (clearSuccess)="onClearSuccess()"
          [error]="error()"
          [successMessage]="successMessage()">
  </shared-toast-container>

  <form (ngSubmit)="onSaveSettings()" [formGroup]="settingsForm" class="settings-form">
    <!-- Sticky Save Bar -->
    <shared-save-bar
            (reset)="onResetToDefaults()"
            [formInvalid]="settingsForm.invalid"
            [isLoading]="isLoading()"
            [isScrolled]="isScrolled()">
    </shared-save-bar>

    <!-- Form Content -->
    <div class="form-content">
      <!-- Provider Configuration Section -->
      <options-provider-config
              (providerChange)="onProviderChange($event)"
              (refreshModels)="onRefreshModels()"
              (testConnection)="onTestConnection()"
              [availableModels]="availableModels()"
              [connectionStatus]="connectionStatus()"
              [isFirefoxMLProvider]="isFirefoxMLProvider()"
              [isTesting]="isTesting()"
              [modelsError]="modelsError()"
              [modelsLoading]="modelsLoading()"
              [providerTypes]="providerTypes()">
      </options-provider-config>

      <!-- Summarization Settings Section -->
      <options-summarization-settings>
      </options-summarization-settings>

      <!-- Cache Settings Section -->
      <options-cache-settings
              (clearCache)="onClearCache()"
              [isLoading]="isLoading()">
      </options-cache-settings>

    </div>
  </form>

  <!-- Footer -->
  <div class="page-footer">
    <div class="footer-left">
      <span>Version 1.0.0</span>
    </div>
  </div>
</div>
